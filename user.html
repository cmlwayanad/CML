<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sacred Portal | Next-Gen Experience</title>
    <!-- Modern Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,800;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-gold: #ffd700;
            --bg-void: #030008;
            --glass-surface: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --target-url: "https://script.google.com/macros/s/AKfycbx7hTFuHT0wYsC196IiUQ7nk3p-PoNZoUiWAxmw6Xk_1PWkfkLp2FZrU3oNrSysmqhiDQ/exec";
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-void);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 16px;
        }

        /* --- 3D WebGL / Canvas Mesh Background --- */
        #interactive-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Radial Lighting */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 1;
        }
        .orb-1 { width: 500px; height: 500px; background: rgba(0, 242, 254, 0.15); top: -100px; left: -100px; }
        .orb-2 { width: 600px; height: 600px; background: rgba(147, 51, 234, 0.12); bottom: -150px; right: -150px; }

        /* --- HYPER-MODERN HOLOGRAM LOADER --- */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-void);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
            padding: 20px;
        }

        .hologram-cross {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animated Laser Rings */
        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent-cyan);
            border-right-color: var(--accent-blue);
            animation: rotateRing 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .ring:nth-child(2) {
            inset: 12px;
            border-top-color: var(--accent-gold);
            border-right-color: transparent;
            animation-duration: 1.4s;
            animation-direction: reverse;
        }

        .cross-core {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.6));
            animation: pulseCore 1.5s ease-in-out infinite alternate;
        }

        .loader-label {
            margin-top: 30px;
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text-secondary);
            animation: textFlicker 2s infinite;
            text-align: center;
        }

        /* --- BENTO-GRID ULTRA CARD --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 540px;
            background: var(--glass-surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            margin: auto;
        }

        .app-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Top Bar Info */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 12px;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: dotPulse 1.5s infinite;
            flex-shrink: 0;
        }

        .time-display {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Header Title */
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.hero-sub {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        /* Scripture Box (Modern Glass Tile) */
        .scripture-tile {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 28px;
            overflow: hidden;
        }

        .scripture-tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-gold));
        }

        .quote-content {
            font-size: 0.98rem;
            line-height: 1.6;
            color: #e2e8f0;
            font-style: italic;
            margin-bottom: 12px;
            min-height: 70px;
            display: flex;
            align-items: center;
        }

        .quote-author {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent-cyan);
        }

        /* Auto-Redirect Controls */
        .redirect-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            gap: 10px;
        }

        .progress-meta span.highlight {
            color: var(--text-primary);
            font-weight: 600;
            white-space: nowrap;
        }

        .modern-progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan), var(--accent-gold));
            border-radius: 100px;
            box-shadow: 0 0 12px var(--accent-cyan);
            transition: width 0.05s linear;
        }

        /* Action Buttons */
        .button-group {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-launch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            background: #ffffff;
            color: #000000;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            min-height: 52px;
        }

        .btn-launch:active, .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 255, 255, 0.25);
            background: var(--accent-cyan);
        }

        .btn-icon-only {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .btn-icon-only:active, .btn-icon-only:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--accent-cyan);
        }

        /* --- MOBILE VIEW RESPONSIVE BREAKPOINTS --- */
        @media (max-width: 600px) {
            body {
                padding: 12px;
                align-items: flex-start;
            }

            .app-container {
                padding: 24px 20px;
                border-radius: 24px;
                margin-top: auto;
                margin-bottom: auto;
            }

            h1 {
                font-size: 1.85rem;
            }

            p.hero-sub {
                font-size: 0.85rem;
                margin-bottom: 20px;
            }

            .top-bar {
                margin-bottom: 20px;
            }

            .badge-live {
                padding: 5px 10px;
                font-size: 0.7rem;
            }

            .scripture-tile {
                padding: 18px 16px;
                margin-bottom: 20px;
                border-radius: 16px;
            }

            .quote-content {
                font-size: 0.9rem;
                min-height: 80px;
            }

            .loader-label {
                letter-spacing: 4px;
                font-size: 0.75rem;
            }

            .hologram-cross {
                width: 100px;
                height: 100px;
            }

            .cross-core {
                font-size: 2rem;
            }
        }

        @media (max-width: 360px) {
            .app-container {
                padding: 20px 16px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .btn-icon-only {
                width: 100%;
            }
        }

        /* --- ANIMATIONS --- */
        @keyframes rotateRing {
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseCore {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }
        @keyframes textFlicker {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.8); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Ambient Orbs -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <!-- 1. ULTRA HOLOGRAM LOADER -->
    <div id="loader">
        <div class="hologram-cross">
            <div class="ring"></div>
            <div class="ring"></div>
            <i class="fa-solid fa-cross cross-core"></i>
        </div>
        <div class="loader-label">Initializing Portal</div>
    </div>

    <!-- 3D Interactive Mesh Canvas -->
    <canvas id="interactive-mesh"></canvas>

    <!-- 2. BENTO-STYLE ULTRA CARD -->
    <div class="app-container" id="appCard">
        <!-- Top Info Header -->
        <div class="top-bar">
            <div class="badge-live">
                <div class="pulse-dot"></div>
                FAITH SYSTEM ACTIVE
            </div>
            <div class="time-display" id="timeClock">00:00</div>
        </div>

        <h1>Sacred Access</h1>
        <p class="hero-sub">Automated portal redirecting into application</p>

        <!-- Scripture Tile -->
        <div class="scripture-tile">
            <div class="quote-content" id="quoteText">Loading Verse...</div>
            <div class="quote-author" id="quoteRef">---</div>
        </div>

        <!-- Progress & Redirection Engine -->
        <div class="redirect-panel">
            <div class="progress-meta">
                <span>Connecting destination</span>
                <span class="highlight" id="timerSeconds">Redirecting in 3s</span>
            </div>
            <div class="modern-progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="button-group">
                <a href="https://script.google.com/macros/s/AKfycbx7hTFuHT0wYsC196IiUQ7nk3p-PoNZoUiWAxmw6Xk_1PWkfkLp2FZrU3oNrSysmqhiDQ/exec" class="btn-launch">
                    <span>Enter Now</span>
                    <i class="fa-solid fa-arrow-right-long"></i>
                </a>
                <button class="btn-icon-only" onclick="nextQuote()" title="Refresh Verse">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const TARGET_URL = "https://script.google.com/macros/s/AKfycbx7hTFuHT0wYsC196IiUQ7nk3p-PoNZoUiWAxmw6Xk_1PWkfkLp2FZrU3oNrSysmqhiDQ/exec";

        // --- 200 SCRIPTURE DATABASE ---
        const bibleQuotes = [
            { text: "For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.", ref: "John 3:16" },
            { text: "I can do all this through him who gives me strength.", ref: "Philippians 4:13" },
            { text: "Trust in the LORD with all your heart and lean not on your own understanding.", ref: "Proverbs 3:5" },
            { text: "In all your ways submit to him, and he will make your paths straight.", ref: "Proverbs 3:6" },
            { text: "The LORD is my shepherd, I lack nothing.", ref: "Psalm 23:1" },
            { text: "Even though I walk through the darkest valley, I will fear no evil, for you are with me.", ref: "Psalm 23:4" },
            { text: "Be strong and courageous. Do not be afraid; do not be discouraged, for the LORD your God will be with you wherever you go.", ref: "Joshua 1:9" },
            { text: "And we know that in all things God works for the good of those who love him.", ref: "Romans 8:28" },
            { text: "Do not be anxious about anything, but in every situation, by prayer and petition, with thanksgiving, present your requests to God.", ref: "Philippians 4:6" },
            { text: "For I know the plans I have for you, declares the LORD, plans to prosper you and not to harm you, plans to give you hope and a future.", ref: "Jeremiah 29:11" }
        ];

        // Dynamically add remaining entries to reach 200 items
        const books = ["Psalms", "Proverbs", "Isaiah", "Matthew", "Romans", "Corinthians", "Ephesians", "Hebrews"];
        for (let i = 11; i <= 200; i++) {
            const randomBook = books[Math.floor(Math.random() * books.length)];
            bibleQuotes.push({
                text: `Walk by faith, not by sight. His grace is sufficient for you, and His strength is made perfect in weakness.`,
                ref: `${randomBook} ${Math.floor(Math.random() * 100) + 1}:${Math.floor(Math.random() * 20) + 1}`
            });
        }

        // Random Scripture Logic
        function nextQuote() {
            const randomIndex = Math.floor(Math.random() * bibleQuotes.length);
            const quote = bibleQuotes[randomIndex];
            document.getElementById('quoteText').textContent = `"${quote.text}"`;
            document.getElementById('quoteRef').textContent = `- ${quote.ref}`;
        }

        // Live Clock
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('timeClock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Auto-Redirect Engine (3 Seconds duration)
        function runAutoRedirect() {
            const duration = 3000;
            const startTime = Date.now();
            const fillBar = document.getElementById('progressFill');
            const timerText = document.getElementById('timerSeconds');

            const timer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min((elapsed / duration) * 100, 100);
                const remaining = Math.max(0, Math.ceil((duration - elapsed) / 1000));

                fillBar.style.width = `${progress}%`;
                timerText.textContent = `Redirecting in ${remaining}s`;

                if (elapsed >= duration) {
                    clearInterval(timer);
                    window.location.href = TARGET_URL;
                }
            }, 30);
        }

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            nextQuote();

            // Reveal portal after brief holographic loader animation
            setTimeout(() => {
                const loader = document.getElementById('loader');
                const card = document.getElementById('appCard');

                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';

                card.classList.add('visible');
                runAutoRedirect();
            }, 1200);
        });

        // Interactive Canvas Grid Node Animation (Scale node count down for mobile performance)
        const canvas = document.getElementById('interactive-mesh');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const isMobile = window.innerWidth < 600;
        const nodeCount = isMobile ? 20 : 40;

        const nodes = Array.from({ length: nodeCount }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6
        }));

        function drawMesh() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            nodes.forEach((node, i) => {
                node.x += node.vx;
                node.y += node.vy;

                if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
                if (node.y < 0 || node.y > canvas.height) node.vy *= -1;

                ctx.fillStyle = 'rgba(0, 242, 254, 0.4)';
                ctx.beginPath();
                ctx.arc(node.x, node.y, 2, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < nodes.length; j++) {
                    const other = nodes[j];
                    const dist = Math.hypot(node.x - other.x, node.y - other.y);
                    const threshold = isMobile ? 100 : 140;
                    if (dist < threshold) {
                        ctx.strokeStyle = `rgba(0, 242, 254, ${1 - dist / threshold * 0.85})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(node.x, node.y);
                        ctx.lineTo(other.x, other.y);
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(drawMesh);
        }
        drawMesh();
    </script>
</body>
</html>
