<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sacred Core | Next-Gen Portal</title>
    <!-- Modern Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --neon-teal: #00f5d4;
            --neon-purple: #7b2cbf;
            --neon-amber: #ff9e00;
            --bg-dark: #05050a;
            --panel-bg: rgba(15, 15, 26, 0.65);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --target-url: "https://script.google.com/macros/s/AKfycbx7hTFuHT0wYsC196IiUQ7nk3p-PoNZoUiWAxmw6Xk_1PWkfkLp2FZrU3oNrSysmqhiDQ/exec";
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            position: relative;
        }

        /* --- Dynamic Canvas Background --- */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- Loader Screen --- */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .loader-hub {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--neon-teal);
            border-bottom-color: var(--neon-purple);
            animation: spin 1.2s linear infinite;
        }

        .cross-glow {
            font-size: 2rem;
            color: var(--text-main);
            text-shadow: 0 0 15px var(--neon-teal);
            animation: pulse 1.5s ease-in-out infinite alternate;
        }

        .loader-text {
            margin-top: 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-sub);
        }

        /* --- Cyber Bento Interface --- */
        .portal-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 580px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: grid;
            gap: 20px;
        }

        .portal-wrapper.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Navigation Header */
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(0, 245, 212, 0.1);
            border: 1px solid rgba(0, 245, 212, 0.3);
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--neon-teal);
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-teal);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-teal);
            animation: pulse 1s infinite alternate;
        }

        .live-clock {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* Main Headline */
        .title-block h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, var(--text-sub));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-block p {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* Bento Grid Content Block */
        .bento-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .quote-body {
            font-size: 1rem;
            line-height: 1.5;
            color: #e2e8f0;
            font-style: italic;
            min-height: 60px;
        }

        .quote-meta {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--neon-amber);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Redirection & Actions */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .progress-header span.count {
            color: var(--text-main);
            font-weight: 600;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-teal));
            border-radius: 10px;
            transition: width 0.05s linear;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-primary {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--neon-teal), #00b4d8);
            color: #05050a;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:active, .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 245, 212, 0.3);
        }

        .btn-secondary {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s ease;
            flex-shrink: 0;
        }

        .btn-secondary:active, .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- Mobile Optimization --- */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .portal-wrapper {
                padding: 24px 20px;
                border-radius: 20px;
                gap: 16px;
            }

            .title-block h1 {
                font-size: 1.5rem;
            }

            .quote-body {
                font-size: 0.9rem;
            }

            .action-row {
                flex-direction: column;
            }

            .btn-secondary {
                width: 100%;
                height: 44px;
            }

            .btn-primary {
                padding: 12px 16px;
            }
        }

        /* --- Animations --- */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <!-- Canvas Animation -->
    <canvas id="particle-canvas"></canvas>

    <!-- Holographic Loader -->
    <div id="loader">
        <div class="loader-hub">
            <div class="spinner-ring"></div>
            <i class="fa-solid fa-cross cross-glow"></i>
        </div>
        <div class="loader-text">Loading Gateway</div>
    </div>

    <!-- Interface Card -->
    <main class="portal-wrapper" id="portalCard">
        <header class="nav-header">
            <div class="status-pill">
                <span class="status-dot"></span>
                <span>PORTAL READY</span>
            </div>
            <div class="live-clock" id="clock">00:00:00</div>
        </header>

        <section class="title-block">
            <h1>Sacred Portal</h1>
            <p>Automatic redirect initiating shortly...</p>
        </section>

        <section class="bento-card">
            <div class="quote-body" id="quoteText">Loading Scripture...</div>
            <div class="quote-meta" id="quoteRef">---</div>
        </section>

        <section class="control-panel">
            <div class="progress-header">
                <span>Rerouting Destination</span>
                <span class="count" id="timerCount">3s</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="action-row">
                <a href="https://script.google.com/macros/s/AKfycbx7hTFuHT0wYsC196IiUQ7nk3p-PoNZoUiWAxmw6Xk_1PWkfkLp2FZrU3oNrSysmqhiDQ/exec" class="btn-primary">
                    <span>Enter Gateway</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
                <button class="btn-secondary" onclick="nextQuote()" title="Refresh Verse">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </section>
    </main>

    <script>
        const TARGET_URL = "https://script.google.com/macros/s/AKfycbx7hTFuHT0wYsC196IiUQ7nk3p-PoNZoUiWAxmw6Xk_1PWkfkLp2FZrU3oNrSysmqhiDQ/exec";

        // Scripture Database
        const bibleQuotes = [
            { text: "For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.", ref: "John 3:16" },
            { text: "I can do all this through him who gives me strength.", ref: "Philippians 4:13" },
            { text: "Trust in the LORD with all your heart and lean not on your own understanding.", ref: "Proverbs 3:5" },
            { text: "The LORD is my shepherd, I lack nothing.", ref: "Psalm 23:1" },
            { text: "Be strong and courageous. Do not be afraid; do not be discouraged.", ref: "Joshua 1:9" },
            { text: "And we know that in all things God works for the good of those who love him.", ref: "Romans 8:28" },
            { text: "For I know the plans I have for you, plans to prosper you and not to harm you.", ref: "Jeremiah 29:11" }
        ];

        function nextQuote() {
            const quote = bibleQuotes[Math.floor(Math.random() * bibleQuotes.length)];
            document.getElementById('quoteText').textContent = `"${quote.text}"`;
            document.getElementById('quoteRef').textContent = `- ${quote.ref}`;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        function startRedirect() {
            const duration = 3000;
            const startTime = Date.now();
            const fill = document.getElementById('progressFill');
            const timerText = document.getElementById('timerCount');

            const interval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min((elapsed / duration) * 100, 100);
                const remaining = Math.max(0, Math.ceil((duration - elapsed) / 1000));

                fill.style.width = `${progress}%`;
                timerText.textContent = `${remaining}s`;

                if (elapsed >= duration) {
                    clearInterval(interval);
                    window.location.href = TARGET_URL;
                }
            }, 30);
        }

        window.addEventListener('DOMContentLoaded', () => {
            nextQuote();
            setTimeout(() => {
                const loader = document.getElementById('loader');
                const portal = document.getElementById('portalCard');
                
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                portal.classList.add('active');
                
                startRedirect();
            }, 1000);
        });

        // Background Particles
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = Array.from({ length: 30 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 1,
            dx: (Math.random() - 0.5) * 0.5,
            dy: (Math.random() - 0.5) * 0.5
        }));

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;

                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 245, 212, 0.3)';
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
